# ═══════════════════════════════════════════════════════════════
# NINA-AES Platform — Docker Compose Développement
#
# Démarre toute l'infrastructure de données et services annexes.
# Les microservices NestJS/FastAPI tournent en local (hors Docker).
#
# Usage :
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down
#   docker compose -f docker-compose.dev.yml logs -f postgres
# ═══════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL 17 — Base de données principale ──
  # (17 car 18 n'a pas encore d'image Docker stable en avril 2026)
  postgres:
    image: postgres:17-alpine
    container_name: nina-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nina
      POSTGRES_PASSWORD: nina_dev
      POSTGRES_DB: nina_aes
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nina -d nina_aes"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nina-network

  # ── Redis 7 — Cache, sessions USSD, queues temporaires ──
  redis:
    image: redis:7-alpine
    container_name: nina-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass nina_dev
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "nina_dev", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nina-network

  # ── RabbitMQ 4 — Broker de messages inter-services ──
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: nina-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI → http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: nina
      RABBITMQ_DEFAULT_PASS: nina_dev
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - nina-network

  # ── MinIO — Stockage objet S3-compatible (photos, PDF, documents) ──
  minio:
    image: minio/minio:latest
    container_name: nina-minio
    restart: unless-stopped
    ports:
      - "9000:9000"     # API S3
      - "9001:9001"     # Console Web → http://localhost:9001
    environment:
      # Aligné avec MINIO_ACCESS_KEY / MINIO_SECRET_KEY du fichier .env (voir .env.example)
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-nina_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-nina_minio_dev}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - nina-network

  # ── Elasticsearch 8 — Recherche floue sur les noms NINA ──
  # (8.x car 9.x pas encore en image Docker stable en avril 2026)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: nina-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=nina-aes
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - nina-network

  # ── Keycloak 26 — Serveur d'identité (OAuth2 / OIDC / RBAC) ──
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: nina-keycloak
    restart: unless-stopped
    ports:
      - "8080:8080"     # Console → http://localhost:8080
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/nina_aes
      KC_DB_USERNAME: nina
      KC_DB_PASSWORD: nina_dev
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_dev
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200\\|UP'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - nina-network

  # ── HashiCorp Vault — Gestion centralisée des secrets ──
  vault:
    image: hashicorp/vault:1.18
    container_name: nina-vault
    restart: unless-stopped
    ports:
      - "8200:8200"     # API + UI → http://localhost:8200
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nina-network

  # ── Maildev — Serveur SMTP de développement (capture des emails) ──
  maildev:
    image: maildev/maildev:2.2.1
    container_name: nina-maildev
    restart: unless-stopped
    ports:
      - "1080:1080"     # UI Web → http://localhost:1080
      - "1025:1025"     # SMTP
    networks:
      - nina-network

# ── Volumes persistants ──
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local
  es_data:
    driver: local

# ── Réseau dédié ──
networks:
  nina-network:
    driver: bridge
    name: nina-aes-network
