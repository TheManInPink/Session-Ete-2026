[project]
name = "nina-aes-ai-service"
version = "0.1.0"
description = "Module IA de détection et correction des erreurs NINA — Pipeline 5 étapes"
authors = ["Ibrahim"]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.44.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "rapidfuzz>=3.14.5",
    "jellyfish>=1.2.1",
    "scikit-learn>=1.8.0",
    "xgboost>=3.2.0",
    "spacy>=3.8.14",
    "pandas>=3.0.2",
    "numpy>=2.4.4",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "pyjwt[crypto]>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "ruff>=0.11.0",
]
ocr = [
    "pytesseract>=0.15.9",
    "Pillow>=12.2.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
