# names.yml — Catalogue de noms et lieux FICTIFS du Mali (dataset synthétique NINA)
#
# ⚠️ DONNÉES 100 % SYNTHÉTIQUES ET ANONYMISÉES.
# Aucun de ces noms ne désigne une personne réelle ; toute ressemblance avec une
# personne existante serait fortuite. Les villages sont inventés (noms plausibles
# phonétiquement) et rattachés à une région administrative historique RAVEC.
# Conforme RGPD-like + Loi malienne 2022-013 (cf. ai-models/README.md §2).
#
# Comptage : 200 prénoms M, 200 prénoms F, 150 patronymes, 50 villages.
# Généré via un fan-out d'agents puis dédoublonné (clé pliée sans accent/casse).
# Couvre les aires culturelles mandé, peule, songhaï, touarègue, dogon, etc.
# region_code = chiffre région RAVEC du NINA : 1=Kayes 2=Koulikoro 3=Sikasso
# 4=Ségou 5=Mopti 6=Tombouctou 7=Gao 8=Kidal 9=Bamako.

