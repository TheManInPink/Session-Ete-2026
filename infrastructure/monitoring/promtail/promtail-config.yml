# ═══════════════════════════════════════════════════════════════════
# Promtail 3.5 — Configuration shipping logs containers → Loki
# ═══════════════════════════════════════════════════════════════════
# Promtail tail les fichiers `/var/lib/docker/containers/*/*.log`
# (JSON Docker), parse les métadonnées via le socket Docker, et envoie
# à Loki avec des labels structurés (container, service, env).
#
# Labels obligatoires (faible cardinalité) :
#   service     — extrait du nom container (nina-identity-service → identity-service)
#   env         — dev / staging / prod
#   level       — debug / info / warn / error (parsé depuis JSON log)
#   container   — nom complet container (debug)
#
# Labels INTERDITS (haute cardinalité) :
#   nina         — UNDER NO CIRCUMSTANCES (PII !)
#   user_id      — pas de label par utilisateur
#   request_id   — utiliser comme champ JSON, pas comme label Loki
# ═══════════════════════════════════════════════════════════════════

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576 # 1 MB
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10
    timeout: 10s

scrape_configs:
  # ─── Containers Docker tagués `nina-*` ──────────────────────────
  - job_name: nina-aes-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: name
            values: ['nina-']
    relabel_configs:
      # Extraire le nom du container (sans le prefix /)
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.+)'
        target_label: 'container'
      # Service = nom container sans le prefix 'nina-'
      - source_labels: ['__meta_docker_container_name']
        regex: '/nina-(.+)'
        target_label: 'service'
      # Image Docker pour debug
      - source_labels: ['__meta_docker_container_image']
        target_label: 'image'
      # Stream stdout/stderr
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
    pipeline_stages:
      # 1) Parser le JSON Docker (champ "log" contient la vraie ligne)
      - json:
          expressions:
            output: log
            stream: stream
            timestamp: time
      # 2) Sortie stdout → timestamp Docker, sinon laisser
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      # 3) Tenter de parser le payload applicatif s'il est en JSON
      #    (Pino émet du JSON ; on extrait les champs level + msg + service)
      - json:
          expressions:
            level: level
            msg: msg
            service_name: service
          source: output
      # 4) Promote `level` en label Loki (cardinalité faible : 4 valeurs)
      - labels:
          level:
      # 5) Output final : le payload JSON entier (lisible dans Grafana
      #    Explore avec auto-parsing des champs)
      - output:
          source: output

  # ─── Container Vault audit log (lecture spéciale fichier) ───────
  - job_name: vault-audit
    static_configs:
      - targets: [localhost]
        labels:
          job: vault-audit
          service: vault
          __path__: /var/lib/docker/volumes/*/logs/audit/*.log
    pipeline_stages:
      - json:
          expressions:
            type: type
            time: time
            auth_path: auth.client_token
            request_path: request.path
            request_op: request.operation
      - labels:
          type:
          request_op:
