apiVersion: 1

# ═══════════════════════════════════════════════════════════════════
# Grafana dashboards provider — charge les .json depuis le volume
# ═══════════════════════════════════════════════════════════════════

providers:
  - name: 'NINA-AES'
    orgId: 1
    folder: 'NINA-AES'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
