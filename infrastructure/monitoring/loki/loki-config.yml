# ═══════════════════════════════════════════════════════════════════
# Loki 3.5 — Configuration single-binary (dev/staging NINA-AES)
# ═══════════════════════════════════════════════════════════════════
# Mode "monolithic" : tous les composants dans un seul process.
# Stockage local /loki/ (volume Docker), retention 30 jours.
#
# Pour la prod : passer en mode microservices + storage S3-compatible
# (cf. doc 19 + ADR-019). En dev : configuration minimale.
# ═══════════════════════════════════════════════════════════════════

auth_enabled: false # Pas d'auth multi-tenant en dev

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Indexation TSDB (recommandé Loki 3.x)
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Limites par tenant (single-tenant ici)
limits_config:
  retention_period: 720h # 30 jours
  max_query_length: 721h
  max_query_parallelism: 32
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 15MB
  reject_old_samples: true
  reject_old_samples_max_age: 168h # 7j max d'antériorité

# Compaction + retention (purge auto)
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

# Pattern matching pour la cardinalité (évite explosion)
analytics:
  reporting_enabled: false # Pas de télémétrie Grafana Cloud
