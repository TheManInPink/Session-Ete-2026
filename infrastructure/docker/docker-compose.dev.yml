# ═══════════════════════════════════════════════════════════════
# NINA-AES Platform — Docker Compose Développement
# ═══════════════════════════════════════════════════════════════
# Variables : fichier `.env` à la RACINE du monorepo (comme les apps NestJS / Next.js).
# Usage : make docker-up   OU   docker compose --env-file .env -f infrastructure/docker/docker-compose.dev.yml up -d
#
# Démarre toute l'infrastructure de données et services annexes.
# Les microservices NestJS/FastAPI tournent en local (hors Docker).
#
# Usage :
#   make docker-up      (demarre tous les services)
#   make docker-down    (arrete tous les services)
#   make docker-logs    (voir les logs)
#   make docker-ps      (voir l'etat)
#
# Option fichier séparé (mêmes clés que `.env`) : voir `.env.docker.example`.
#   docker compose --env-file infrastructure/docker/.env.docker -f infrastructure/docker/docker-compose.dev.yml up -d
#
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down
#   docker compose -f docker-compose.dev.yml logs -f postgres
#
# Services inclus (versions au 2026-05-23) :
#   - PostgreSQL 18 + PostGIS 3.6 (5432) — Base principale (+ géographie)
#   - Redis 8.6.3 (6379) — Cache et sessions (AOF activé)
#   - RabbitMQ 4.2.4-management (5672 / 15672) — Message broker
#   - Elasticsearch 9.4.1 (9200) — Recherche floue
#   - Kibana 9.4.1 (5601) — Console visualisation ES
#   - MinIO + minio-init (9000 / 9001) — Stockage objet + bucket auto-créé
#     ⚠️ Repo minio/minio archivé avril 2026 — pinné sur la dernière release
#     officielle (RELEASE.2025-09-07T16-13-09Z) ; migration à planifier (Garage,
#     RustFS, Chainguard) avant la prochaine CVE bloquante.
#   - Keycloak 26.6.2 (8080) — Authentification IAM
#   - Vault 2.0.1 (8200) — Secrets (mode dev) — saut majeur 1.x → 2.x (mai 2026)
#   - Maildev 2.2.1 (1080 / 1025) — SMTP de test
# ═══════════════════════════════════════════════════════════════

name: nina-aes-dev

services:
  # ──────────────────────────────────────────────────────────────
  # ── PostgreSQL 18 + PostGIS — Base de données principale ──
  # ──────────────────────────────────────────────────────────────
  # Heberge les donnees NINA, les utilisateurs, les logs d'audit,
  # les structures gouvernementales et les schemas Keycloak.
  postgres:
    # Image officielle PostGIS basée sur PostgreSQL 18 — fournit pgcrypto,
    # uuid-ossp, pg_trgm, unaccent, citext ET postgis (extension spatiale
    # nécessaire pour les colonnes `geography(Point,4326)` du modèle Location).
    image: postgis/postgis:18-3.6
    container_name: nina-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nina_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nina_dev_2026!}
      POSTGRES_DB: ${POSTGRES_DB:-nina_aes_db}
      # Locale ICU française pour le tri alphabétique correct des noms maliens.
      # ICU est portable (pas besoin de générer la locale dans l'image), utilisé
      # par PostgreSQL 16+. `--data-checksums` détecte la corruption disque.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=fr-FR --encoding=UTF8 --data-checksums'
      # Fuseau horaire de Bamako (GMT+0, pas de changement d'heure)
      TZ: Africa/Bamako
    volumes:
      # Données persistantes — Postgres 18 exige un montage sur le parent
      # `/var/lib/postgresql` (et non `/data`) pour permettre `pg_upgrade --link`
      # entre versions majeures. Le sous-dossier `<major>/data` est créé par
      # l'image au premier démarrage.
      - nina-postgres-data:/var/lib/postgresql
      # Scripts d'initialisation exécutés au premier démarrage UNIQUEMENT
      # (alphabetic order — 01 avant 02).
      - ../../scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      # Seed géographique généré depuis data/mali/*.json — schéma geo_ref
      # isolé de public.locations (qui sera créé par Prisma migrate).
      - ../scripts/seed-locations.sql:/docker-entrypoint-initdb.d/02-seed-locations.sql:ro
    healthcheck:
      # pg_isready vérifie que PostgreSQL accepte les connexions
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nina_admin} -d ${POSTGRES_DB:-nina_aes_db}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - nina-network

  # ── Redis 8.6 — Cache, sessions USSD, queues temporaires ──
  # Stocke : sessions Keycloak, sessions USSD (TTL 5 min),
  # cache des recherches fréquentes, rate limiting
  redis:
    # Pinné sur 8.6.3 (dernière patch stable au 2026-05-23) pour reproductibilité
    # entre dev / CI / prod. Le tag flottant `8.6-alpine` glisse à chaque patch.
    image: redis:8.6.3-alpine
    container_name: nina-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_dev_2026!}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - nina-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redis_dev_2026!}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nina-network

  # ──────────────────────────────────────────────────────────────
  # RabbitMQ 4.2 — Broker de messages entre microservices
  # ──────────────────────────────────────────────────────────────
  # Les microservices communiquent de maniere asynchrone via RabbitMQ.
  # Transporte les événements entre microservices :
  # - identity.created → audit-service + notification-service
  # - correction.validated → identity-service + document-service
  # - notification.sms → notification-service (envoi SMS via Orange/AT)

  # Exemples : identity-service publie un evenement "nina.created",
  # audit-service et notification-service s'y abonnent.
  rabbitmq:
    # Pinné sur 4.2.4 (release du 2026-02-27) pour reproductibilité dev/CI/prod.
    image: rabbitmq:4.2.4-management-alpine
    container_name: nina-rabbitmq
    restart: unless-stopped
    ports:
      # Port AMQP (utilisé par les microservices)
      - '${RABBITMQ_PORT:-5672}:5672' # AMQP
      # Port de l'interface web de management
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672' # Management UI → http://localhost:15672
    environment:
      # Alias des variables applicatives RABBITMQ_USER / RABBITMQ_PASSWORD (.env racine)
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-${RABBITMQ_USER:-nina_rabbit}}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-${RABBITMQ_PASSWORD:-rabbit_dev_2026!}}
    volumes:
      - nina-rabbitmq-data:/var/lib/rabbitmq
      # Configuration et définitions pré-chargées (exchanges, queues, bindings)
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - nina-network

  # ──────────────────────────────────────────────────────────────
  # MinIO — Stockage objet compatible S3
  # ──────────────────────────────────────────────────────────────
  # Stocke les photos d'identite, les documents scannes,
  # les PDF de Fiches Descriptives generees.
  minio:
    # ⚠️ minio/minio archivé le 2026-04-25 — plus de nouvelles images après le
    # 2025-10-23. On pinne sur la DERNIÈRE release officielle disponible
    # (RELEASE.2025-09-07T16-13-09Z) jusqu'à migration vers une alternative
    # maintenue (Chainguard cgr.dev/chainguard/minio, ou fork pgsty/minio,
    # ou successeur S3-compatible : Garage / RustFS / SeaweedFS).
    # Voir docs/05-INFRASTRUCTURE-DOCKER-COMPOSE.md §"MinIO — fin de support".
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: nina-minio
    restart: unless-stopped
    ports:
      # API S3 (utilisée par les microservices)
      - '${MINIO_API_PORT:-9000}:9000' # API S3
      # Console web d'administration
      - '${MINIO_CONSOLE_PORT:-9001}:9001' # Console Web → http://localhost:9001
    environment:
      # MINIO_ACCESS_KEY / MINIO_SECRET_KEY (apps) ≡ MINIO_ROOT_* (conteneur)
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-${MINIO_ACCESS_KEY:-nina_minio_admin}}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${MINIO_SECRET_KEY:-minio_dev_2026!}}
    volumes:
      - nina-minio-data:/data
    # Démarrer MinIO en mode serveur avec la console activée
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - nina-network

  # ──────────────────────────────────────────────────────────────
  # Elasticsearch 9.4 — Recherche floue sur les noms NINA
  # ──────────────────────────────────────────────────────────────
  # Permet de :
  # - Chercher "Mamadu" et trouver "Mamadou" (fuzzy matching)
  # - Chercher par phonétique (Soundex/Metaphone) pour les noms bambara
  # - Autocomplétion dans les formulaires de recherche NINA
  # - Indexer les 20M+ enregistrements pour des réponses < 100ms
  # Pinné sur 9.4.1 (release du 2026-05-12). Kibana doit suivre la même version.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.1
    container_name: nina-elasticsearch
    restart: unless-stopped
    ports:
      - '${ES_PORT:-9200}:9200'
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-${ELASTICSEARCH_PASSWORD:-elastic_dev_2026!}}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      # Limiter la mémoire JVM en dev pour éviter de consommer tout le RAM du PC
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms512m -Xmx512m}
      # Désactiver le machine learning (pas besoin en dev, économise la RAM)
      - xpack.ml.enabled=false
      - cluster.name=nina-aes
    volumes:
      - nina-elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "curl -s -u elastic:${ELASTIC_PASSWORD:-${ELASTICSEARCH_PASSWORD:-elastic_dev_2026!}} http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    # Elasticsearch a besoin de plus de mémoire virtuelle
    ulimits:
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - nina-network

  # ──────────────────────────────────────────────────────────────
  # Kibana 9.4.1 — Console de visualisation Elasticsearch
  # ──────────────────────────────────────────────────────────────
  # Interface web pour explorer les index ES en dev : visualiser les
  # documents NINA indexés, debug des requêtes fuzzy, monitoring du
  # cluster. Non requis en production (alerting via Grafana).
  # ⚠️ Kibana et Elasticsearch DOIVENT partager la même version majeure.minor.
  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.1
    container_name: nina-kibana
    restart: unless-stopped
    ports:
      - '${KIBANA_PORT:-5601}:5601' # UI Web → http://localhost:5601
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      # Kibana doit s'authentifier auprès d'Elasticsearch (xpack.security activé).
      ELASTICSEARCH_USERNAME: kibana_system
      # En dev, Kibana utilise un mot de passe simple sur l'utilisateur
      # `kibana_system` (créé manuellement OU via setup ES). Fallback sur le
      # password elastic root si non configuré.
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD:-${ELASTIC_PASSWORD:-${ELASTICSEARCH_PASSWORD:-elastic_dev_2026!}}}
      SERVER_NAME: nina-kibana
      SERVER_HOST: 0.0.0.0
      # Clés de chiffrement (≥32 chars) requises par Fleet, alerting et reporting.
      # Sans elles, le setup Fleet boucle sur FleetEncryptedSavedObjectEncryptionKeyRequired.
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY}
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_SECURITY_ENCRYPTION_KEY}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_REPORTING_ENCRYPTION_KEY}
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -s http://localhost:5601/api/status | grep -q ''"level":"available"'' || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - nina-network

  # ──────────────────────────────────────────────────────────────
  # MinIO init — Création automatique du bucket par défaut
  # ──────────────────────────────────────────────────────────────
  # Job one-shot : attend que MinIO soit healthy, configure l'alias,
  # crée le bucket `nina-documents` (idempotent), pose une policy public-read.
  # Évite l'étape manuelle « créer le bucket via la console » au premier boot.
  minio-init:
    # `minio/mc` (client CLI) suit un calendrier de release indépendant de
    # `minio/minio` (serveur) — la dernière mc disponible est antérieure à la
    # dernière release serveur. Avec l'archivage du repo MinIO (avril 2026),
    # le tag `latest` est figé et ne reçoit plus de mises à jour — autant
    # pinner explicitement la dernière release mc officielle pour rendre le
    # bootstrap reproductible (et éviter qu'un pull futur tire une image
    # ré-uploadée par un tiers).
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: nina-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_nina: http://${MINIO_ROOT_USER:-${MINIO_ACCESS_KEY:-nina_minio_admin}}:${MINIO_ROOT_PASSWORD:-${MINIO_SECRET_KEY:-minio_dev_2026!}}@minio:9000
    entrypoint: >
      /bin/sh -c "
        echo 'Création du bucket nina-documents...' &&
        mc mb --ignore-existing nina/nina-documents &&
        echo 'Bucket prêt — versionning activé en dev pour faciliter le rollback' &&
        mc version enable nina/nina-documents &&
        echo '✅ MinIO bootstrapped' &&
        exit 0
      "
    networks:
      - nina-network
    restart: 'no'

  # ──────────────────────────────────────────────────────────────
  # Keycloak 26.6.2 — Serveur d'identité (OAuth2 / OIDC / RBAC)
  # ──────────────────────────────────────────────────────────────
  # Centralise l'authentification de TOUS les acteurs du système :
  # - 6 rôles : citoyen, agent, superviseur, admin, auditeur, inspecteur
  # - OAuth2 + OpenID Connect (standards ouverts)
  # - MFA (TOTP + SMS) pour les agents
  # - Sessions gérées dans Redis (pas en mémoire)

  # Centralise l'authentification de tous les acteurs :
  # citoyen, agent, superviseur, administrateur, auditeur,
  # inspecteur anti-corruption.
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.2
    container_name: nina-keycloak
    restart: unless-stopped
    ports:
      - '${KC_PORT:-8080}:8080' # Console → http://localhost:8080
    environment:
      # Connexion à PostgreSQL (base "keycloak" créée par init-db.sql)
      KC_DB: ${KC_DB:-postgres}
      KC_DB_URL: ${KC_DB_URL:-jdbc:postgresql://postgres:5432/keycloak}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-${POSTGRES_USER:-nina_admin}}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-${POSTGRES_PASSWORD:-nina_dev_2026!}}
      # Mode développement (HTTP, pas de certificat TLS requis)
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: ${KC_HTTP_ENABLED:-true}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-${KEYCLOAK_ADMIN:-admin}}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-${KEYCLOAK_ADMIN_PASSWORD:-keycloak_admin_2026!}}
      KC_HEALTH_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      # Cache distribué désactivé en dev (single node)
      KC_CACHE: local
    # Démarrer en mode développement
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200\\|UP'",
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - nina-network

  # ── HashiCorp Vault 2.0.1 — Gestion centralisée des secrets ──
  vault:
    # Saut majeur 1.x → 2.x publié le 2026-05-19. Seule breaking change pour les
    # conteneurs : la capacité IPC_LOCK est désormais posée sur le binaire à la
    # build, donc le runtime DOIT toujours l'ajouter (cf. `cap_add` ci-dessous —
    # déjà en place). Le mode `start-dev`, les variables `VAULT_DEV_*` et le
    # listener HTTP sur 8200 sont inchangés.
    image: hashicorp/vault:2.0.1
    container_name: nina-vault
    restart: unless-stopped
    ports:
      - '${VAULT_PORT:-8200}:8200' # API + UI → http://localhost:8200
    environment:
      # Token root du mode dev. Surchargeable via .env mais "nina-dev" par
      # défaut pour cohérence avec le prompt 2.1 d'infrastructure.
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-nina-dev}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ['CMD-SHELL', 'VAULT_ADDR=http://127.0.0.1:8200 vault status']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nina-network

  # ──────────────────────────────────────────────────────────────
  # MailDev — Serveur SMTP de test (capture emails)
  # ──────────────────────────────────────────────────────────────
  # Intercepte TOUS les emails envoyes par notification-service.
  # Interface web : http://localhost:1080
  # Port SMTP : 1025
  maildev:
    # Pinné sur 2.2.1 (dernière stable au 2026-05-23) — `latest` non reproductible.
    image: maildev/maildev:2.2.1
    container_name: nina-maildev
    restart: unless-stopped
    ports:
      # Interface web pour lire les emails interceptés
      - '${MAILDEV_WEB_PORT:-1080}:1080' # UI Web → http://localhost:1080
      # Port SMTP (les microservices envoient ici)
      - '${MAILDEV_SMTP_PORT:-1025}:1025' # SMTP
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:1080/healthz || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - nina-network

# ──────────────────────────────────────────────────────────────
# Volumes nommes (persistants entre les redemarrages)
# ──────────────────────────────────────────────────────────────
volumes:
  nina-postgres-data:
    name: nina-postgres-data
  nina-redis-data:
    name: nina-redis-data
  nina-rabbitmq-data:
    name: nina-rabbitmq-data
  nina-elasticsearch-data:
    name: nina-elasticsearch-data
  nina-minio-data:
    name: nina-minio-data

# ──────────────────────────────────────────────────────────────
# Reseau interne (les conteneurs se voient par nom de service)
# ──────────────────────────────────────────────────────────────
networks:
  nina-network:
    driver: bridge
    name: nina-aes-network
