packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'

# ─── pnpm 11 — allowlist explicite des packages dont les scripts ─────
# `postinstall` sont autorisés à s'exécuter à l'installation.
#
# Sans cette liste, pnpm 11 lève ERR_PNPM_IGNORED_BUILDS et bloque
# toute action `pnpm install` (et donc tous les turbo run check-types
# qui font un install implicite).
#
# Stratégie : autoriser uniquement les binaires natifs reconnus
# nécessaires au build (engines Prisma, watcher Parcel, SWC, esbuild,
# sharp pour Next.js image, protobufjs pour OpenTelemetry gRPC,
# unrs-resolver pour les workspaces Turborepo).
#
# Format pnpm 11 : map avec valeurs booléennes (true = autorisé).
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
