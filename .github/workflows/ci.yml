# ═══════════════════════════════════════════════════════════════════
# NINA-AES Platform — Pipeline CI principal
# ═══════════════════════════════════════════════════════════════════
# Déclenché sur push main/develop + pull_request.
# 7 jobs en parallèle (lint / test-backend / test-ai / test-frontend /
# test-e2e / build / security), avec dépendances explicites.
#
# Conventions :
#   - Souveraineté : Trivy + Semgrep + gitleaks + pnpm audit + Bandit
#     (PAS Snyk — exclu par ADR-016, SaaS US)
#   - Versions infra alignées avec docker-compose.dev.yml :
#     PostgreSQL 18 + PostGIS / Redis 8.6 / RabbitMQ 4.2 / Python 3.14
#   - Composite action .github/actions/setup-node-pnpm pour DRY
#
# Cf. docs/16-CICD-GITHUB-ACTIONS.md + ADR-016.
# ═══════════════════════════════════════════════════════════════════

name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Annule les runs précédents sur la même branche
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions minimales par défaut (renforcées par job au besoin)
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1 — Lint + typecheck + format check + verify:repo
  # ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint · Format · Typecheck · verify:repo
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          # Sans `prisma generate`, `tsc --noEmit` sur @nina-aes/database
          # plante avec TS2305: Module '"@prisma/client"' has no exported
          # member 'PrismaClient' (le client est généré, pas vendoré).
          prisma-generate: 'true'

      - name: ESLint
        run: pnpm run lint

      - name: Prettier check
        run: pnpm run format:check

      - name: TypeScript typecheck (Turbo)
        run: pnpm run check-types

      - name: verify:repo (data + schemas + docs sync)
        run: pnpm run verify:repo

  # ─────────────────────────────────────────────────────────────────
  # Job 2 — Tests backend Node (Jest + Supertest + Testcontainers)
  # ─────────────────────────────────────────────────────────────────
  test-backend:
    name: Tests backend (Jest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: lint

    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: nina_admin
          POSTGRES_PASSWORD: ci-test-password-do-not-reuse
          POSTGRES_DB: nina_aes_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nina_admin -d nina_aes_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8.6.3-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:4.2.4-management-alpine
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics check_running"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://nina_admin:ci-test-password-do-not-reuse@localhost:5432/nina_aes_test
      REDIS_URL: redis://localhost:6379
      RABBITMQ_URL: amqp://localhost:5672
      JWT_SECRET: ci-test-jwt-secret-minimum-32-characters-long-padding
      NODE_ENV: test
      ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          prisma-generate: 'true'

      - name: Activate PostGIS extension
        run: |
          PGPASSWORD=ci-test-password-do-not-reuse psql -h localhost -U nina_admin \
            -d nina_aes_test -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Apply Prisma migrations
        run: pnpm --filter @nina-aes/database exec prisma migrate deploy

      - name: Run Jest (packages + services Bloc A)
        # `--passWithNoTests` est déjà dans le script `test` de chaque
        # package (jest l'accepte en double silencieusement, mais vitest@4
        # rejette les flags dupliqués -> ERR "received [true, true]" sur
        # @nina-aes/database). On ne passe plus que --coverage.
        run: pnpm test -- --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage
          path: '**/coverage/coverage-final.json'
          retention-days: 14
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────
  # Job 3 — Tests AI / Python (Pytest matrix sur 2 services FastAPI)
  # ─────────────────────────────────────────────────────────────────
  test-ai:
    name: Tests AI · ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        service: [ai-service, anticorruption-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin Python 3.13 (et non 3.14 comme le code applicatif) tant que
      # spaCy 3.8.14 ne publie pas de wheels cp314. La transitive `blis`
      # tente alors de build depuis le source contre l'API CPython 3.14
      # (_PyLong_AsByteArray signature changée) et échoue. Suivre les
      # releases spaCy (https://github.com/explosion/spaCy/releases) et
      # remonter à 3.14 quand les wheels seront publiées.
      - name: Setup Python 3.13 (en attente des wheels spaCy cp314)
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      # `|| [ $? -eq 5 ]` : pytest exit code 5 = "no tests collected" ;
      # anticorruption-service n'a pas encore de tests (scaffold uniquement),
      # on le tolère comme les autres jobs `--passWithNoTests`.
      - name: Run pytest
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-report=term --tb=short || [ $? -eq 5 ]

      - name: Upload pytest coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.xml
          retention-days: 14
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────
  # Job 4 — Tests frontend (Jest + React Testing Library) sur les 3 apps
  # ─────────────────────────────────────────────────────────────────
  test-frontend:
    name: Tests frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    needs: lint
    env:
      NINA_AUTH_MODE: mock
      CI: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Run Jest frontend (citizen + admin + governance + packages/ui)
        # Idem job test-backend : --passWithNoTests déjà dans chaque script,
        # le re-passer fait planter vitest@4 (cf. commentaire au job précédent).
        run: |
          pnpm test \
            --filter=@nina-aes/citizen \
            --filter=@nina-aes/admin \
            --filter=@nina-aes/governance \
            --filter=@nina-aes/ui \
            -- --coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: 'apps/*/coverage/coverage-final.json'
          retention-days: 14
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────
  # Job 5 — Tests E2E Playwright (mode mock, sans backend réel)
  # ─────────────────────────────────────────────────────────────────
  test-e2e:
    name: Tests E2E (Playwright mock)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: lint
    env:
      NINA_AUTH_MODE: mock
      CI: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build apps citizen + admin
        run: pnpm run build --filter=@nina-aes/citizen --filter=@nina-aes/admin

      - name: Run Playwright smoke tests
        run: pnpm exec playwright test --reporter=html,github

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────
  # Job 6 — Build Docker images (uniquement push main, matrix 11 services)
  # ─────────────────────────────────────────────────────────────────
  build:
    name: Build Docker · ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [lint, test-backend, test-ai, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      # Limite la concurrence : avec 11 matrix jobs en parallèle, le
      # GITHUB_TOKEN partagé se fait throttler par GitHub côté git clone
      # (`fatal: could not read Username for 'https://github.com': terminal
      # prompts disabled`). À 3 jobs simultanés, chaque checkout passe.
      max-parallel: 3
      matrix:
        service:
          - identity-service
          - auth-service
          - ai-service
          - document-service
          - notification-service
          - interop-service
          - audit-service
          - appointment-service
          - anticorruption-service
          - governance-service
          - vulnerability-service

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/nina-aes-${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Dockerfile (FastAPI vs NestJS)
        id: dockerfile
        run: |
          case "${{ matrix.service }}" in
            ai-service|anticorruption-service)
              echo "path=infrastructure/docker/Dockerfile.fastapi" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "path=infrastructure/docker/Dockerfile.nestjs" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ─────────────────────────────────────────────────────────────────
  # Job 7 — Sécurité (Trivy + Semgrep + gitleaks + pnpm audit + Bandit)
  # ─────────────────────────────────────────────────────────────────
  # NB : Snyk explicitement rejeté par ADR-016 (SaaS US). Couverture
  # équivalente via outils open-source self-hostable.
  # ─────────────────────────────────────────────────────────────────
  security:
    name: Sécurité
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: lint
    permissions:
      contents: read
      security-events: write # Upload SARIF vers GitHub Security tab
      pull-requests: read # gitleaks-action liste les commits de la PR (sinon 403 sur pull_request)

    steps:
      - name: Checkout (full history pour gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─── Trivy filesystem scan ───────────────────────────────────
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # IMPORTANT : sans ceci, le format SARIF fait scanner TOUTES les
          # sévérités et `exit-code:1` se déclenche aussi sur des findings
          # LOW/MEDIUM — le filtre `severity: CRITICAL,HIGH` est ignoré pour le
          # gate. On limite donc SARIF + exit-code à CRITICAL,HIGH (intention).
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-fs.sarif
          exit-code: '1'

      # `continue-on-error` : l'upload code-scanning échoue ("Resource not
      # accessible by integration") sur les runs `pull_request` / quand GitHub
      # Advanced Security n'est pas activé. C'est de la VISIBILITÉ (onglet
      # Security), pas un gate — un échec d'upload ne doit pas faire échouer le
      # job sécurité (le gate, c'est l'exit-code de Trivy lui-même).
      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # ─── Semgrep (OWASP + TS + Python) ───────────────────────────
      - name: Semgrep static analysis
        uses: returntocorp/semgrep-action@v1
        env:
          SEMGREP_RULES: >-
            p/owasp-top-ten
            p/javascript
            p/typescript
            p/python
            p/secrets

      # ─── gitleaks (détection secrets historiques) ────────────────
      - name: gitleaks (secrets scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ─── pnpm audit (Node deps CVEs) ─────────────────────────────
      - name: Setup Node + pnpm (sans install)
        uses: ./.github/actions/setup-node-pnpm
        with:
          install: 'false'

      - name: pnpm audit (CRITICAL/HIGH)
        run: pnpm audit --audit-level=high --prod
        continue-on-error: false

      # ─── Bandit (Python static analysis) ─────────────────────────
      - name: Setup Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Bandit scan FastAPI services
        run: |
          pip install bandit[toml]
          # -s B104 : le bind sur 0.0.0.0 est INTENTIONNEL pour des services
          # FastAPI conteneurisés (joignables dans le conteneur / K3s) — l'isolation
          # se fait au niveau réseau/conteneur, pas au bind. Faux positif en contexte.
          bandit -r services/ai-service/app services/anticorruption-service/app -ll -s B104
